# 매일 AVA 링크트리 / 공연 페이지 / 준석이 StageTime 프로필을 확인해서 공연 일정에 반영
#  - 준석이 이름이 확인되면 바로 공개, 아니면 숨김 초안으로 추가
#  - 새 공연이 있으면 GitHub 이슈(알림 메일)로 알려줌
name: AVA schedule sync

on:
  schedule:
    - cron: "0 13 * * *"   # 매일 13:00 UTC (한국 밤 10시 / 필라델피아 오전 9시)
  workflow_dispatch:        # Actions 탭에서 "Run workflow"로 바로 실행 가능

permissions:
  contents: write
  issues: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check AVA for new performances
        run: python scripts/ava_sync.py
      - name: Commit & publish
        if: hashFiles('ava_sync_summary.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ava-sync-bot"
          git config user.email "ava-sync-bot@users.noreply.github.com"
          git add content/performances.json
          git commit -m "AVA sync: new performances found"
          git push
          gh api -X POST repos/${{ github.repository }}/pages/builds || true
          gh issue create --title "🎟️ AVA 새 공연 알림 ($(date +%Y-%m-%d))" --body-file ava_sync_summary.md
